<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
    <title>Tic-Tac-Toe</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }
  
  :root {
    --primary-color: #fff;
    --secondary-color: #56ed68;
    --tertiary-color: black;
    --fourth-color: #fff;
    --fifth-color: #56ed68;
    --sixth-color: #56ed68;
  }
  
  html {
    font-size: 62.5%;
  }
  
  body {
    background: var(--secondary-color);
  }
  
  .dark-theme {
    --primary-color: #30363d;
    --secondary-color: #0d1117;
    --tertiary-color: #fff;
    --fourth-color: #fff;
    --fifth-color: #fff;
    --sixth-color: #fff;
  }
  
  .toggle-btn {
    position: absolute;
    width: 4.8rem;
    height: 2.4rem;
    right: 2rem;
    top: 2rem;
    border: 0.2rem solid;
    border-radius: 2rem;
    border-color: var(--primary-color);
    background: var(--primary-color);
  }
  
  .toggle-btn .inner-circle {
    position: absolute;
    width: 2rem;
    height: 2rem;
    left: 0.1rem;
    border-radius: 50%;
    cursor: pointer;
    background: var(--secondary-color);
    transition: all 0.4s ease;
  }
  
  .toggle-btn.active {
    background: var(--primary-color);
    border-color: #0d1117;
  }
  
  .toggle-btn.active .inner-circle {
    margin-left: 50%;
    background: #fff;
  }
  
  .select-box,
  .play-board,
  .result-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.3s ease;
  }
  
  .select-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--primary-color);
    padding: 2rem 2.5rem 2.5rem;
    border-radius: 0.5rem;
    max-width: 33rem;
    width: 100%;
    color: var(--tertiary-color);
  }
  
  .select-box.hide {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.9);
  }
  
  .select-box header {
    font-size: 2.3rem;
    font-weight: 600;
    padding-bottom: 0.1rem;
    border-bottom: 0.1rem solid #ccc;
  }
  
  .select-box .title {
    font-size: 1.5rem;
    font-weight: bold;
    margin: 2rem 0;
  }
  
  .select-box .options {
    display: flex;
    width: 100%;
  }
  
  .options button {
    width: 100%;
    font-size: 1.8rem;
    font-weight: 500;
    padding: 0.8rem 0;
    border: none;
    background: var(--secondary-color);
    border-radius: 0.5rem;
    color: var(--primary-color);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .options button:hover,
  .result-box .btn button:hover {
    transform: scale(0.95);
  }
  
  .options button.playerX {
    margin-right: 0.5rem;
    color: var(--fourth-color);
  }
  
  .options button.playerO {
    margin-left: 0.5rem;
    color: var(--fourth-color);
  }
  
  .play-board {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.9);
  }
  
  .play-board.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(0.9);
  }
  
  .play-board .details {
    background: var(--primary-color);
    padding: 0.7rem;
    border-radius: 0.5rem;
  }
  
  .play-board .details .players {
    display: flex;
    width: 100%;
    position: relative;
    justify-content: space-between;
  }
  
  .play-board .details span {
    width: 100%;
    color: var(--sixth-color);
    border-radius: 0.5rem;
    padding: 0.7rem 0;
    font-size: 1.9rem;
    font-weight: 500;
    cursor: default;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 5;
    transition: all 0.3s ease;
  }
  
  .details span:first-child {
    color: var(--fourth-color);
  }
  
  .details .slider {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 50%;
    background: var(--secondary-color);
    border-radius: 0.5rem;
    z-index: 2;
    transition: all 0.3s ease;
  }
  
  .players.active span:first-child {
    color: var(--sixth-color);
  }
  
  .players.active span:nth-child(2) {
    color: var(--fourth-color);
  }
  .players.active .slider {
    left: 50%;
  }
  
  .play-board .play-area {
    margin-top: 2rem;
  }
  
  .play-board section {
    display: flex;
  }
  
  .play-board section span {
    display: block;
    margin: 0.2rem;
    height: 8rem;
    width: 8rem;
    background: var(--primary-color);
    border-radius: 0.5rem;
    font-size: 4rem;
    text-align: center;
    line-height: 8rem;
    color: var(--fifth-color);
  }
  
  .result-box {
    background: var(--primary-color);
    padding: 2rem;
    font-weight: bold;
    border-radius: 5px;
    max-width: 35rem;
    width: 100%;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1);
  }
  
  .result-box.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-505, -50%) scale(1);
  }
  
  .result-box .won-text {
    font-size: 2.5rem;
    color: var(--tertiary-color);
    font-weight: bold;
    display: flex;
    justify-content: center;
  }
  
  .result-box .won-text p {
    font-weight: 600;
    margin-top: 0 0.5rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
  }
  
  .result-box .btn {
    display: flex;
    justify-content: center;
    margin-top: 2rem;
  }
  
  .result-box .btn button {
    font-size: 1.8rem;
    font-weight: 500;
    padding: 0.8rem 2rem;
    color: var(--fourth-color);
    border: none;
    background: var(--secondary-color);
    border-radius: 0.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .footer {
    position: relative;
    top: 95vh;
    padding: 0.5rem !important;
    border-color: inherit;
    border-style: solid;
    border-width: 0;
    background-color: #212529 !important;
  }
  .footer h4 {
    color: white;
    text-align: center;
  }
  /*@media(prefers-color-scheme: dark){
  
      
      .select-box .title{
          font-weight: unset;
      }
      
      .players.active span:first-child{
          color:  #fff;
      }
      .play-board .details span, .play-board section span{
          color:  #fff;
      }
      
  }*/
    </style>
</head>
<body>

    <div class="container">     
        <div class="toggle-btn" id="icon" onclick="this.classList.toggle('active')">
            <div class="inner-circle"></div>
        </div>  
    </div>

    <div class="select-box">
        <header>Tic Tac Toe</header>
        <div class="content">
            <div class="title">Select which player you want to be?</div>
            <div class="options">
                <button class="playerX">Player (X)</button>
                <button class="playerO">Player (O)</button>
            </div>
        </div>
    </div>

    <div class="play-board">
        <div class="details">
            <div class="players">
                <span class="Xturn">X's turn</span>
                <span class="Oturn">O's turn</span>
                <div class="slider"></div>
            </div>
        </div>
        <div class="play-area">
            <section><span class="box1"></span><span class="box2"></span><span class="box3"></span></section>
            <section><span class="box4"></span><span class="box5"></span><span class="box6"></span></section>
            <section><span class="box7"></span><span class="box8"></span><span class="box9"></span></section>
        </div>
    </div>

    <div class="result-box">
        <div class="won-text"></div>
        <div class="btn">
            <button>Replay</button>
        </div>
    </div>

    <script>
        //selecting all required elements
const selectBox = document.querySelector(".select-box"),
    selectBtnX = selectBox.querySelector(".options .playerX"),
    selectBtnO = selectBox.querySelector(".options .playerO"),
    playBoard = document.querySelector(".play-board"),
    players = document.querySelector(".players"),
    allBox = document.querySelectorAll("section span"),
    resultBox = document.querySelector(".result-box"),
    wonText = resultBox.querySelector(".won-text"),
    replayBtn = resultBox.querySelector("button");

    var icon = document.getElementById("icon");
    icon.onclick = function(){
        document.body.classList.toggle("dark-theme");
        if(document.body.classList.contains("dark-theme")){
        icon.classList.add("active");
        }else{
            icon.classList.remove("active");
        }
    }

window.onload = () => { 
    for (let i = 0; i < allBox.length; i++) { 
        allBox[i].setAttribute("onclick", "clickedBox(this)");
    }
}

selectBtnX.onclick = () => {
    selectBox.classList.add("hide"); 
    playBoard.classList.add("show"); 
}

selectBtnO.onclick = () => {
    selectBox.classList.add("hide");
    playBoard.classList.add("show"); 
    players.setAttribute("class", "players active player"); 
}

let playerXIcon = "fa fa-times";  
let playerOIcon = "fa fa-circle";
let playerSign = "X"; 
let runBot = true; 


function clickedBox(element) {
    if (players.classList.contains("player")) {
        playerSign = "O"; 
        element.innerHTML = `<i class="${playerOIcon}"></i>`;
        players.classList.add("active"); 
        element.setAttribute("id", playerSign); 
    } else {
        element.innerHTML = `<i class="${playerXIcon}"></i>`; 
        players.classList.add("active"); 
        element.setAttribute("id", playerSign); 
    }
    selectWinner(); 
    element.style.pointerEvents = "none"; 
    playBoard.style.pointerEvents = "none"; 
    let randomTimeDelay = ((Math.random() * 1000) + 200).toFixed(); 
    setTimeout(() => {
        bot(); 
    }, randomTimeDelay); 
}


function bot() {
    let array = []; 
    if (runBot) { 
        playerSign = "O"; 
        for (let i = 0; i < allBox.length; i++) {
            if (allBox[i].childElementCount == 0) { 
                array.push(i); 
            }
        }
        let randomBox = array[Math.floor(Math.random() * array.length)]; 
        if (array.length > 0) { 
            if (players.classList.contains("player")) {
                playerSign = "X"; 
                allBox[randomBox].innerHTML = `<i class="${playerXIcon}"></i>`; 
                players.classList.remove("active"); 
                allBox[randomBox].setAttribute("id", playerSign); 
            } else {
                allBox[randomBox].innerHTML = `<i class="${playerOIcon}"></i>`; 
                players.classList.remove("active"); 
                allBox[randomBox].setAttribute("id", playerSign); 
            }
            selectWinner(); 
        }
        allBox[randomBox].style.pointerEvents = "none"; 
        playBoard.style.pointerEvents = "auto"; 
        playerSign = "X"; 
    }
}

function getIdVal(classname) {
    return document.querySelector(".box" + classname).id; 
}
function checkIdSign(val1, val2, val3, sign) { 
    if (getIdVal(val1) == sign && getIdVal(val2) == sign && getIdVal(val3) == sign) {
        return true;
    }
}
function selectWinner() { 
    if (checkIdSign(1, 2, 3, playerSign) || checkIdSign(4, 5, 6, playerSign) || checkIdSign(7, 8, 9, playerSign) || checkIdSign(1, 4, 7, playerSign) || checkIdSign(2, 5, 8, playerSign) || checkIdSign(3, 6, 9, playerSign) || checkIdSign(1, 5, 9, playerSign) || checkIdSign(3, 5, 7, playerSign)) {
        runBot = false; 
        bot(); 
        setTimeout(() => { 
            resultBox.classList.add("show");
            playBoard.classList.remove("show");
        }, 1000); 
        wonText.innerHTML = `Player <p>${playerSign}</p> won the game!`; 
    } else { 
        if (getIdVal(1) != "" && getIdVal(2) != "" && getIdVal(3) != "" && getIdVal(4) != "" && getIdVal(5) != "" && getIdVal(6) != "" && getIdVal(7) != "" && getIdVal(8) != "" && getIdVal(9) != "") {
            runBot = false; 
            bot(); 
            setTimeout(() => { 
                resultBox.classList.add("show");
                playBoard.classList.remove("show");
            },1000); 
            wonText.textContent = "Match has been drawn!"; 
        }
    }
}

replayBtn.onclick = () => {
    window.location.reload(); 
}
    </script>
</body>
</html>
